name: Analyse de sécurité (Strix)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: strix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strix:
    name: Pentest quick
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Les secrets ne sont pas transmis aux PR venues d'un fork : le scan ne
    # pourrait pas s'authentifier, et il n'a pas à voir du code non approuvé.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : nécessaire au diff-scope (merge-base avec la base).
          fetch-depth: 0

      - name: Installer Strix (version épinglée, intégrité vérifiée)
        env:
          # Version et empreinte du binaire, mises à jour volontairement.
          STRIX_VERSION: "1.7.0"
          STRIX_SHA256: "b8cd7e84d63cbeff6726301a9e08fddedf40fc6a4edcdb4edda8a853b3312de6"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/strix-${STRIX_VERSION}.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/usestrix/strix/releases/download/v${STRIX_VERSION}/strix-${STRIX_VERSION}-linux-x86_64.tar.gz"
          echo "${STRIX_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.strix/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/strix-${STRIX_VERSION}-linux-x86_64" "$HOME/.strix/bin/strix"
          "$HOME/.strix/bin/strix" --version

      - name: Scanner
        env:
          # Modèle : OpenCode Go + DeepSeek V4.1 Flash.
          STRIX_LLM: openai/deepseek-v4.1-flash
          LLM_API_BASE: https://opencode.ai/inference/go/openai/v1
          LLM_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          STRIX_API_TYPE: chat_completions
          STRIX_CACHE_BLOCK_TOKENS: "64"
          # Pas de télémétrie depuis la CI.
          STRIX_TELEMETRY: "0"
          # Passés par l'environnement, jamais interpolés dans le script :
          # une valeur de contexte GitHub injectée telle quelle dans un `run`
          # permet une injection de commandes shell.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        # Plafonds stricts : le scan s'arrête sur budget ou nombre de tours,
        # et n'échoue le job que sur du high/critical.
        run: |
          # La gateway OpenCode exige le User-Agent, l'en-tête client et un
          # identifiant de session, sinon elle répond 403 ou MissingSessionID.
          export LLM_EXTRA_HEADERS="{\"User-Agent\":\"opencode/1.18.31\",\"x-opencode-client\":\"cli\",\"x-opencode-session\":\"$(cat /proc/sys/kernel/random/uuid)\"}"

          SCOPE_ARGS="--scope-mode full"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SCOPE_ARGS="--scope-mode diff --diff-base origin/$BASE_REF"
          fi
          ~/.strix/bin/strix -n -t ./ -m quick \
            --fail-on high \
            --max-budget 5 \
            --max-turns 60 \
            $SCOPE_ARGS

      - name: Publier les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-findings
          path: strix_runs/**
          retention-days: 30

      - name: Envoyer le SARIF à Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
          category: strix
